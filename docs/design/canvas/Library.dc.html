<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>書庫</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/storyspheredesignsystemv3_f1cc58/styles.css">
<link rel="stylesheet" href="ds/storyspheredesignsystemv3_f1cc58/ui_kits/web_app/kit.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;family=Noto+Serif+TC:wght@400;600;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;family=Fira+Code:wght@400;500&amp;display=swap">
<style>
body{margin:0}
:root{--fg-muted:#776c5b;--accent:#a0522f;--focus-ring-color:#a0522f}
[data-theme="ink"]{--fg-muted:#737373}
a{color:var(--accent)}a:hover{opacity:.9}
a.ss-btn,a.ss-card-link{text-decoration:none}
a.ss-card-link{color:inherit}
.ss-badge-neutral{background:var(--bg-secondary);color:var(--fg-secondary)}
</style>
</helmet>
<div data-theme="{{theme}}" style="min-height: 1000px; display: flex; background: var(--bg-primary); color: var(--fg-primary); font-family: var(--font-sans);">
<nav class="ss-sidebar" aria-label="主導覽">
  <a href="Library.dc.html" class="active" aria-current="page" aria-label="書庫"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 6 4 14"></path><path d="M12 6v14"></path><path d="M8 8v12"></path><path d="M4 4v16"></path></svg></a>
  <div class="ss-rail-divider"></div>
  <a href="Registry.dc.html" aria-label="方法目錄"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="16" y="16" width="6" height="6" rx="1"></rect><rect x="2" y="16" width="6" height="6" rx="1"></rect><rect x="9" y="2" width="6" height="6" rx="1"></rect><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"></path><path d="M12 12V8"></path></svg></a>
  <div class="ss-sidebar-spacer"></div>
  <a href="Jobs.dc.html" aria-label="工作中心"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg></a>
  <a href="Settings.dc.html" aria-label="設定"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></a>
</nav>
<div class="ss-main">
  
  <main style="width: 100%; max-width: 1280px; box-sizing: border-box; padding: var(--space-7) var(--space-7) var(--space-8); display: flex; flex-direction: column; gap: var(--space-6);">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--space-5);">
      <div style="display: flex; flex-direction: column; gap: var(--space-2);">
        <h1 style="margin: 0; font-family: var(--font-serif); font-size: var(--font-size-3xl); font-weight: 700; line-height: 1.2;">書庫</h1>
        <p style="margin: 0; font-size: var(--font-size-xs); color: var(--fg-muted);">4 本 · 1 本入庫中 · 1 本暫停 · 1 本等待章節審閱</p>
      </div>
      <div style="display: flex; gap: var(--space-4); align-items: center;">
        <span class="ss-badge ss-badge-info">原型示意資料</span>
        <button type="button" class="ss-btn ss-btn-md ss-btn-primary"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg><span>上傳</span></button>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--space-6);">

      <a class="ss-bookcard ss-card-link" href="Main.dc.html">
        <div class="ss-bookcard-cover"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg></div>
        <div class="ss-bookcard-title">四簽名</div>
        <div class="ss-bookcard-author">柯南‧道爾 · 1890</div>
        <div style="display: flex; gap: var(--space-3); flex-wrap: wrap;"><span class="ss-badge ss-badge-success">已入庫</span><span class="ss-badge ss-badge-neutral">推理</span></div>
        <div class="ss-bookcard-meta"><span>12 章</span><span>10 張結果卡</span><span>筆記 3</span></div>
      </a>

      <a class="ss-bookcard ss-card-link" href="Ingest.dc.html">
        <div class="ss-bookcard-cover"><span class="ss-loader" style="color: var(--fg-muted);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.2-8.6"></path></svg></span></div>
        <div class="ss-bookcard-title">綠野仙蹤</div>
        <div class="ss-bookcard-author">鮑姆 · 1900</div>
        <div style="display: flex; gap: var(--space-3); flex-wrap: wrap;"><span class="ss-badge ss-badge-warning">入庫中</span></div>
        <div class="ss-bookcard-meta"><span>S1 核心抽取＋訊號 · 62%</span></div>
        <div class="ss-progress"><div class="ss-progress-fill" style="width: 62%;"></div></div>
      </a>

      <div class="ss-bookcard" style="cursor: default;">
        <div class="ss-bookcard-cover"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--fg-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg></div>
        <div class="ss-bookcard-title">傲慢與偏見</div>
        <div class="ss-bookcard-author">奧斯汀 · 1813</div>
        <div style="display: flex; gap: var(--space-3); flex-wrap: wrap;"><span class="ss-badge ss-badge-warning">暫停：額度用完</span></div>
        <p style="margin: 0; font-size: var(--font-size-2xs); color: var(--fg-secondary); line-height: 1.5;">S1 已完成 41／96 個單位；已完成的不必重跑。</p>
        <div style="margin-top: auto;"><button type="button" class="ss-btn ss-btn-sm ss-btn-secondary ss-btn-llm">續跑</button></div>
      </div>

      <div class="ss-bookcard" style="cursor: default;">
        <div class="ss-bookcard-cover"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg></div>
        <div class="ss-bookcard-title">阿Q正傳</div>
        <div class="ss-bookcard-author">魯迅 · 1921</div>
        <div style="display: flex; gap: var(--space-3); flex-wrap: wrap;"><span class="ss-badge ss-badge-info">等待章節審閱</span></div>
        <p style="margin: 0; font-size: var(--font-size-2xs); color: var(--fg-secondary); line-height: 1.5;">文件處理完成，偵測到 9 章。審閱後才開始抽取。</p>
        <div style="margin-top: auto;"><a class="ss-btn ss-btn-sm ss-btn-secondary" href="Ingest.dc.html">前往審閱</a></div>
      </div>

      <button type="button" class="ss-bookcard ss-bookcard-upload" style="font-family: inherit;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--fg-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        <span style="font-weight: 600; color: var(--fg-secondary);">拖曳檔案至此，或點擊選擇檔案</span>
        <span style="font-size: var(--font-size-2xs);">支援 .pdf、.docx、.txt、.epub 格式，可多選</span>
      </button>
    </div>

    <p style="margin: 0; font-size: var(--font-size-2xs); color: var(--fg-muted); line-height: 1.6;">上傳後依設定頁的模型配置入庫，會消耗 token。全書只讀一次；題材判定後的預設分析會自動接著跑。</p>
  </main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["warm","ink"],"default":"warm"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'warm' };
  }
}
</script>
</body>
</html>
