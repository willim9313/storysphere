[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/storysphere"]

[project]
name = "storysphere"
version = "0.1.0"
description = "StorySphere v4 prototype: evidence store, method registry and agent-ready viewer"
readme = "CLAUDE.md"
requires-python = ">=3.11"

# 依賴只在任務用到時才加（uv add），版本下限沿用舊 repo 的 pyproject.toml。
dependencies = [
    # ========== Core Framework ==========
    "pydantic>=2.0",
    # ========== Web Framework ==========
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "greenlet>=3.0",
    "pyyaml>=6.0",
    "langchain>=1.3.9",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "langchain-claude-agent-sdk>=0.2.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "langdetect>=1.0.9",
    "charset-normalizer>=3.0",
    "pypdf>=6.13.3",
    "python-docx>=1.1",
    "ebooklib>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    # FastAPI TestClient 需要
    "httpx>=0.27",
]

# ========== Ruff Configuration ==========
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",
    "B008",
    "C901",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

# ========== Pytest Configuration ==========
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=backend/storysphere",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
markers = [
    "integration: tests that call real external APIs (deselect with -m 'not integration')",
]

# ========== Coverage Configuration ==========
[tool.coverage.run]
source = ["backend/storysphere"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
